<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量重命名 · 自定义前缀</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
            padding: 30px 35px 40px;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #0b1b33;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .subhead {
            color: #4a5a72;
            font-size: 15px;
            margin-bottom: 24px;
            border-left: 4px solid #3b82f6;
            padding-left: 16px;
            background: #f0f4fe;
            border-radius: 0 12px 12px 0;
            line-height: 1.5;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px 20px;
            margin-bottom: 20px;
        }
        .prefix-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            padding: 4px 14px 4px 18px;
            border-radius: 60px;
            border: 1px solid #dce3ed;
        }
        .prefix-group label {
            font-weight: 500;
            color: #1e293b;
            font-size: 14px;
        }
        .prefix-group input {
            border: none;
            background: transparent;
            padding: 8px 4px;
            font-size: 15px;
            width: 100px;
            outline: none;
            font-weight: 500;
            color: #0b1b33;
        }
        .prefix-group input:focus {
            border-bottom: 2px solid #2563eb;
        }
        .prefix-group .hint {
            color: #6b7f9a;
            font-size: 13px;
            padding-left: 4px;
        }
        .btn {
            background: #1e293b;
            border: none;
            color: white;
            font-weight: 500;
            font-size: 15px;
            padding: 10px 24px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px -2px rgba(0,0,0,0.05);
            letter-spacing: 0.3px;
        }
        .btn-primary {
            background: #2563eb;
        }
        .btn-primary:hover {
            background: #1d4ed8;
            transform: scale(1.02);
            box-shadow: 0 8px 14px -6px #2563eb80;
        }
        .btn-outline {
            background: transparent;
            color: #1e293b;
            border: 1.5px solid #d1d9e6;
        }
        .btn-outline:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.4);
        }
        .stats-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }
        .stats {
            font-size: 14px;
            color: #475569;
            background: #f1f5f9;
            padding: 6px 16px;
            border-radius: 40px;
            white-space: nowrap;
        }
        .file-grid {
            background: #fafcff;
            border-radius: 20px;
            border: 1px solid #e9edf4;
            overflow: hidden;
            margin: 18px 0 20px;
        }
        .grid-header {
            display: grid;
            grid-template-columns: 2.5fr 2.5fr 1.2fr 0.9fr;
            background: #f1f6fd;
            padding: 12px 18px;
            font-weight: 600;
            font-size: 13px;
            color: #1e3a6b;
            border-bottom: 1px solid #dce3ed;
            letter-spacing: 0.3px;
        }
        .file-row {
            display: grid;
            grid-template-columns: 2.5fr 2.5fr 1.2fr 0.9fr;
            padding: 12px 18px;
            align-items: center;
            border-bottom: 1px solid #edf2f9;
            font-size: 14px;
            transition: 0.1s;
        }
        .file-row:last-child {
            border-bottom: none;
        }
        .file-row:hover {
            background: #f8faff;
        }
        .file-name {
            color: #0b1b33;
            font-weight: 500;
            word-break: break-all;
            padding-right: 8px;
        }
        .file-name-new {
            color: #0b5e2e;
            font-weight: 500;
            word-break: break-all;
        }
        .file-size {
            color: #2d3f5e;
            font-size: 13px;
        }
        .file-status {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .badge {
            background: #d1dbe9;
            padding: 2px 10px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            color: #1f3a5f;
        }
        .badge-success {
            background: #d1fae5;
            color: #0a6b3a;
        }
        .badge-pending {
            background: #fef9c3;
            color: #854d0e;
        }
        .log-area {
            margin-top: 28px;
            border-top: 1px solid #e2eaf2;
            padding-top: 20px;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .log-header span {
            font-weight: 600;
            color: #1e293b;
            font-size: 15px;
        }
        .log-box {
            background: #0b1422;
            color: #d4e2ff;
            padding: 16px 20px;
            border-radius: 16px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #2d3a52;
        }
        .log-box:empty::before {
            content: '等待操作… 点击 "执行重命名" 生成日志';
            color: #7a8aa3;
            font-style: italic;
        }
        .footer-note {
            margin-top: 16px;
            font-size: 13px;
            color: #5f6f87;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .footer-note kbd {
            background: #eef2f7;
            padding: 2px 8px;
            border-radius: 30px;
            font-size: 12px;
            border: 1px solid #d3dce8;
        }
        .empty-message {
            padding: 28px 20px;
            text-align: center;
            color: #6f7f97;
            font-size: 15px;
        }
        .warning-banner {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 16px;
            color: #78350f;
            font-size: 14px;
        }
        @media (max-width: 720px) {
            .container { padding: 20px; }
            .grid-header, .file-row { grid-template-columns: 1.8fr 1.8fr 1fr 0.7fr; font-size: 13px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .stats-group { margin-left: 0; justify-content: center; }
            .prefix-group { justify-content: space-between; }
            .prefix-group input { width: 80px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📁 批量重命名 <span style="font-size: 20px; font-weight: 400; color: #3b6ba5;">· 自定义前缀</span></h1>
    <div class="subhead">
        ⚡ 文件从 <strong>001</strong> 开始顺序编号，保留原扩展名。<br>
        可自定义前缀（默认 <strong>cn</strong>），点击执行后生成 <strong>log.txt</strong> 映射记录。
    </div>

    <div class="warning-banner">
        ⚠️ 浏览器环境无法直接修改本地文件，本工具提供<strong>预览重命名效果</strong>并生成 <strong>log.txt</strong> 下载。<br>
        如需实际重命名，请使用 Node.js 版本或参考日志手动操作。
    </div>

    <div class="toolbar">
        <div class="prefix-group">
            <label for="prefixInput">前缀</label>
            <input type="text" id="prefixInput" value="cn" placeholder="例如: img" spellcheck="false">
            <span class="hint">+ 序号</span>
        </div>
        <button class="btn btn-primary" id="renameBtn">🚀 执行重命名</button>
        <button class="btn btn-outline" id="resetBtn">↺ 重置预览</button>
        <div class="stats-group">
            <button class="btn btn-outline" id="loadFolderBtn" style="padding: 6px 16px; font-size: 13px;">📂 选择文件夹</button>
            <button class="btn btn-outline" id="downloadLogBtn" style="padding: 6px 16px; font-size: 13px;">⬇ 下载 log.txt</button>
            <span class="stats" id="fileCount">📄 0 个文件</span>
        </div>
    </div>

    <!-- 文件列表预览 -->
    <div class="file-grid" id="fileGrid">
        <div class="grid-header">
            <span>源文件名</span>
            <span>重命名后</span>
            <span>大小 (bytes)</span>
            <span>状态</span>
        </div>
        <div id="fileListContainer">
            <div class="empty-message">📂 请点击 "选择文件夹" 加载文件，或使用内置示例</div>
        </div>
    </div>

    <!-- 日志输出 -->
    <div class="log-area">
        <div class="log-header">
            <span>📋 映射日志 (log.txt 内容)</span>
            <span style="font-size:13px; color:#4b6a8f;">新文件 → 源文件</span>
        </div>
        <div class="log-box" id="logBox"></div>
    </div>
    <div class="footer-note">
        <span>💡 日志格式: <kbd>新文件名</kbd>    <kbd>源文件名</kbd> (四个空格分隔)</span>
        <span><kbd>排序</kbd> 从小到大 (size)</span>
    </div>
</div>

<script>
    (function() {
        // ---------- 核心状态 ----------
        let fileList = [];           // { name, size, ext, newName, status }
        let renameMap = [];          // 用于生成log
        let isRenamed = false;

        // DOM 元素
        const fileListContainer = document.getElementById('fileListContainer');
        const logBox = document.getElementById('logBox');
        const fileCountSpan = document.getElementById('fileCount');
        const renameBtn = document.getElementById('renameBtn');
        const resetBtn = document.getElementById('resetBtn');
        const loadFolderBtn = document.getElementById('loadFolderBtn');
        const downloadLogBtn = document.getElementById('downloadLogBtn');
        const prefixInput = document.getElementById('prefixInput');

        // ---------- 辅助函数 ----------
        function getFileExtension(filename) {
            const idx = filename.lastIndexOf('.');
            return idx !== -1 ? filename.substring(idx) : '';
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            const val = (bytes / Math.pow(k, i)).toFixed(1);
            return `${val} ${sizes[i]}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 获取当前前缀 (用户输入，若为空则使用 'cn')
        function getPrefix() {
            const raw = prefixInput.value.trim();
            return raw || 'cn';
        }

        // 生成新文件名 (prefix + 序号 + ext)
        function generateNewName(index, ext, total, prefix) {
            const digits = Math.max(3, String(total).length);
            const padded = String(index).padStart(digits, '0');
            return `${prefix}${padded}${ext}`;
        }

        // 生成 log 内容 (新文件名    源文件名)
        function generateLogContent() {
            if (!renameMap.length) return '暂无重命名记录。';
            // 按新文件名排序 (实际上就是按序号)
            return renameMap.map(item => `${item.newName}    ${item.oldName}`).join('\n');
        }

        // 下载 log.txt
        function downloadLogTxt(content) {
            if (!content || content === '暂无重命名记录。') {
                alert('暂无重命名记录，请先执行重命名。');
                return;
            }
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'log.txt';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }

        // ---------- 渲染界面 ----------
        function renderFileList() {
            if (!fileList.length) {
                fileListContainer.innerHTML = `<div class="empty-message">📂 请点击 "选择文件夹" 加载文件</div>`;
                fileCountSpan.textContent = '📄 0 个文件';
                return;
            }

            let html = '';
            fileList.forEach((item) => {
                const statusClass = item.status === 'done' ? 'badge-success' : 'badge-pending';
                const statusText = item.status === 'done' ? '✓ 已重命名' : '就绪';
                const displayNewName = item.newName || '—';
                html += `
                    <div class="file-row">
                        <span class="file-name">${escapeHtml(item.name)}</span>
                        <span class="file-name-new">${escapeHtml(displayNewName)}</span>
                        <span class="file-size">${formatSize(item.size)}</span>
                        <span class="file-status"><span class="badge ${statusClass}">${statusText}</span></span>
                    </div>
                `;
            });
            fileListContainer.innerHTML = html;
            fileCountSpan.textContent = `📄 ${fileList.length} 个文件`;
        }

        function updateLogBox() {
            logBox.textContent = generateLogContent();
        }

        // ---------- 核心操作：执行重命名 (预览模式) ----------
        function performRename() {
            if (!fileList.length) {
                alert('没有文件可重命名。请先加载文件。');
                return;
            }

            const prefix = getPrefix();
            // 按大小排序 (从小到大)
            const sorted = [...fileList].sort((a, b) => a.size - b.size);
            const total = sorted.length;

            // 构建映射
            const newMap = [];
            sorted.forEach((item, index) => {
                const newName = generateNewName(index + 1, item.ext, total, prefix);
                newMap.push({
                    oldName: item.name,
                    newName: newName,
                    size: item.size,
                    ext: item.ext
                });
            });

            // 更新 fileList 中的 newName 和 status
            fileList.forEach(item => {
                const found = newMap.find(m => m.oldName === item.name);
                if (found) {
                    item.newName = found.newName;
                    item.status = 'done';
                }
            });

            // 更新 renameMap
            renameMap = newMap.map(({ oldName, newName }) => ({ oldName, newName }));

            // 刷新界面
            renderFileList();
            updateLogBox();
            isRenamed = true;

            // 自动下载 log.txt
            downloadLogTxt(generateLogContent());
        }

        // ---------- 重置状态 ----------
        function resetState() {
            if (!fileList.length) {
                loadSampleData();
                return;
            }
            if (confirm('重置将恢复为示例文件列表，并清空重命名状态。确定吗？')) {
                loadSampleData();
            }
        }

        // ---------- 加载示例数据 ----------
        function loadSampleData() {
            const samples = [
                { name: 'report_2024.pdf', size: 2048 },
                { name: 'image_01.png', size: 5120 },
                { name: 'data_backup.zip', size: 15360 },
                { name: 'notes.txt', size: 320 },
                { name: 'presentation.pptx', size: 8192 },
                { name: 'photo_house.jpg', size: 4096 },
                { name: 'script.js', size: 1024 },
                { name: 'style.css', size: 768 },
            ];
            fileList = samples.map((f) => ({
                name: f.name,
                size: f.size,
                ext: getFileExtension(f.name),
                newName: '',
                status: 'ready'
            }));
            renameMap = [];
            isRenamed = false;
            renderFileList();
            logBox.textContent = '示例数据已加载。点击 "执行重命名" 预览效果。';
        }

        // ---------- 用户选择文件夹 ----------
        function loadFolder() {
            const input = document.createElement('input');
            input.type = 'file';
            input.webkitdirectory = true;
            input.multiple = true;
            input.onchange = (e) => {
                const files = e.target.files;
                if (!files || !files.length) {
                    alert('未选择任何文件或文件夹。');
                    return;
                }

                const newList = [];
                for (let i = 0; i < files.length; i++) {
                    const f = files[i];
                    if (f.size > 0 || getFileExtension(f.name)) {
                        newList.push({
                            name: f.name,
                            size: f.size,
                            ext: getFileExtension(f.name),
                            newName: '',
                            status: 'ready'
                        });
                    }
                }

                if (!newList.length) {
                    alert('该文件夹中没有找到有效文件。');
                    return;
                }

                // 去重
                const uniqueMap = new Map();
                newList.forEach(item => {
                    if (!uniqueMap.has(item.name)) {
                        uniqueMap.set(item.name, item);
                    }
                });
                fileList = Array.from(uniqueMap.values());
                renameMap = [];
                isRenamed = false;
                renderFileList();
                logBox.textContent = `已加载文件夹，共 ${fileList.length} 个文件。点击 "执行重命名"。`;
            };
            input.click();
        }

        // ---------- 初始化 ----------
        function init() {
            loadSampleData();

            renameBtn.addEventListener('click', performRename);
            resetBtn.addEventListener('click', resetState);
            loadFolderBtn.addEventListener('click', loadFolder);
            downloadLogBtn.addEventListener('click', () => {
                downloadLogTxt(generateLogContent());
            });

            // 输入框按回车触发重命名
            prefixInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    performRename();
                }
            });
        }

        init();
    })();
</script>
</body>
</html>
